name: Sync and deploy Supabase Edge Function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ujohhylcrkyoqhkpnhyt
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Download current remote function
        run: |
          rm -rf supabase/functions/mini-persona
          supabase functions download mini-persona --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Commit downloaded function source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/mini-persona
          git diff --cached --quiet || git commit -m "chore: sync mini-persona edge function source"
          git push

      - name: Deploy function
        run: supabase functions deploy mini-persona --project-ref "$SUPABASE_PROJECT_ID" --use-api
